id: post-comment-enhance
name: "文章评论增强"
version: "20260823084917"
description: "为评论和文章正文提供表情短码插入与渲染，后台编辑器提供表情面板，支持文章短代码、文章尾部自定义 HTML 和正则拦截垃圾评论。"
author: "youthlin"
default_enabled: true

assets:
  dir: assets

hooks:
  actions:
    - head.end
    - comment.form.after_textarea
    - admin.post.form.after_textarea
  filters:
    - comment.content_html
    - post.content_source
    - post.content_html
    - post.footer_html
    - comment.before_create

lifecycle:
  activate: true
  deactivate: true
  uninstall: true

options:
  - id: enabled
    type: bool
    label: "启用表情"
    default: "true"
  - id: enable_post_smilies
    type: bool
    label: "启用文章表情"
    default: "true"
  - id: enable_admin_smiley_panel
    type: bool
    label: "后台编辑器显示表情面板"
    default: "true"
  - id: post_footer_html
    type: textarea
    label: "文章尾部 HTML"
    description: "每篇文章正文末尾追加的 HTML。可用变量：%siteURL% %siteName% %siteDesc% %postURL% %postID% %postTitle% %postSlug% %postExcerpt% %postAuthor% %postAuthorUsername%"
    default: ""
  - id: shortcode_rules
    type: shortcode_rules
    label: "文章短代码"
    description: "把文章正文中的 [短代码 属性=值]内容[/短代码] 渲染为受控 HTML 标签。属性名只能从内置名单选择，属性值必须匹配对应正则。"
    default: ""
    options:
      - value: "src"
        label: "src"
      - value: "href"
        label: "href"
      - value: "class"
        label: "class"
      - value: "title"
        label: "title"
      - value: "width"
        label: "width"
      - value: "height"
        label: "height"
      - value: "loading"
        label: "loading"
      - value: "referrerpolicy"
        label: "referrerpolicy"
      - value: "sandbox"
        label: "sandbox"
      - value: "allow"
        label: "allow"
      - value: "allowfullscreen"
        label: "allowfullscreen"
      - value: "target"
        label: "target"
      - value: "rel"
        label: "rel"
  - id: comment_reject_pattern
    type: text
    label: "评论拦截正则"
    description: "评论内容匹配此正则表达式时将被拒绝提交（Go 正则语法，如 ^[A-Za-z0-9\\s\\pP]+$ 匹配纯英文/数字/标点）。留空则不启用。"
    default: ""
  - id: comment_reject_message
    type: text
    label: "评论拦截提示"
    description: "评论被正则匹配时返回给用户的错误提示。"
    default: "评论内容不符合规则，提交失败。"
