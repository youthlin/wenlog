# Twenty Twenty 风格主题 — 复刻 WordPress Twenty Twenty 子主题
name: "twentytwenty"
version: "1.1.0"
description: "Twenty Twenty 风格，居中单栏布局，暖米色背景，Inter 字体，支持暗色模式"
author: "youthlin"
author_uri: "https://youthlin.com"
theme_uri: "https://github.com/youthlin/blog"
license: "MIT"
tags: ["单栏", "响应式", "暗色模式", "TwentyTwenty"]

widget_areas:
  footer:
    name: "页脚组件"
    description: "页面底部区域"

menu_locations:
  primary:
    name: "主导航"
    description: "站点顶部导航菜单"

options:
  - id: custom_css
    type: css
    label: "自定义 CSS"
    description: "会注入到页面 <head> 中"
    default: ""

  - id: footer_text
    type: text
    label: "页脚文字"
    description: "显示在页面底部"
    default: "Powered by Blog"
