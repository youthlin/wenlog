# 默认主题配置 — v6: 组件级选项 + 可重复组件
name: "default"
version: "1.0"
description: "默认主题，内容+边栏双栏设计，带多种颜色外观"
author: "youthlin"
author_uri: "https://github.com/youthlin"
theme_uri: "https://github.com/youthlin/blog"
license: "MIT"
tags: ["双栏", "响应式", "多配色"]

widget_areas:
  sidebar:
    name: "侧边栏"
    description: "文章页侧边栏区域"

widgets:
  - id: user_info
    label: "用户信息"
    area: sidebar

  - id: search
    label: "搜索"
    area: sidebar

  - id: saying
    label: "博主动态"
    area: sidebar
    options:
      - id: post_id
        type: number
        label: "文章 ID"
        description: "用于读取博主评论的文章/页面 ID"
        default: "456"
        min: 1

  - id: recent_posts
    label: "近期文章"
    area: sidebar
    options:
      - id: count
        type: number
        label: "显示数量"
        default: "5"
        min: 1
        max: 20

  - id: popular_posts
    label: "热门文章"
    area: sidebar
    options:
      - id: count
        type: number
        label: "显示数量"
        default: "5"
        min: 1
        max: 20

  - id: recent_comments
    label: "近期评论"
    area: sidebar

  - id: archive_months
    label: "归档"
    area: sidebar

  - id: categories
    label: "分类目录"
    area: sidebar

  - id: tag_cloud
    label: "标签云"
    area: sidebar

options:
  - id: custom_css
    type: css
    label: "自定义 CSS"
    description: "会注入到页面 <head> 中"
    default: ""

  - id: footer_text
    type: text
    label: "页脚文字"
    description: "显示在页面底部"
    default: "Powered by Blog"
