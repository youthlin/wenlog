# Spread — 宽屏杂志主题
name: "spread"
version: "20260801221504"
description: "宽屏满幅色块、杂志目录式列表和大胆触摸交互的主题"
author: "youthlin"
author_uri: "https://github.com/youthlin"
theme_uri: "https://github.com/youthlin/wenlog"
license: "MIT"
tags: ["宽屏", "杂志", "满幅", "响应式"]

widget_areas:
  footer:
    name: "页脚组件区"
    description: "显示在页脚的内置小组件区域"

menu_locations:
  primary:
    name: "主导航"
    description: "站点顶部导航菜单"
  footer:
    name: "页脚菜单"
    description: "显示在页脚站点信息下方的次级菜单"

options:
  - id: custom_css
    type: css
    label: "自定义 CSS"
    description: "会注入到页面 <head> 中"
    default: ""

  - id: hero_image
    type: image
    label: "首页 Hero 背景图"
    description: "首页顶部大标题背景图。留空时使用默认必应壁纸。"
    default: "https://www.bing.com/th?id=OHR.HawaiiLava_ZH-CN3257621771_1920x1080.jpg&rf=LaDigue_1920x1080.jpg&pid=hp"

  - id: footer_text
    type: text
    label: "页脚文字"
    description: "显示在页面底部"
    default: "Published with WenLog"
