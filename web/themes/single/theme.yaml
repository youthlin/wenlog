# 极简暗黑主题 — 单栏布局，纯暗色，无颜色切换
name: "single"
version: "3.0"
description: "极简暗黑单栏主题，纯暗色外观"
author: "youthlin"
author_uri: "https://github.com/youthlin"
theme_uri: "https://github.com/youthlin/blog"
license: "MIT"
tags: ["单栏", "暗色", "极简"]

widget_areas:
  footer:
    name: "页脚"
    description: "页面底部区域"

widgets:
  - id: user_info
    label: "用户信息"
    area: footer

  - id: search
    label: "搜索"
    area: footer

  - id: recent_posts
    label: "近期文章"
    area: footer
    options:
      - id: count
        type: number
        label: "显示数量"
        default: "5"
        min: 1
        max: 20

  - id: recent_comments
    label: "近期评论"
    area: footer

  - id: categories
    label: "分类目录"
    area: footer

  - id: tag_cloud
    label: "标签云"
    area: footer

  - id: custom_html
    label: "自定义 HTML"
    area: footer
    options:
      - id: html
        type: textarea
        label: "HTML 内容"
        description: "任意 HTML 代码，会原样输出到页面中"
        default: ""

options:
  - id: footer_text
    type: text
    label: "页脚文字"
    description: "显示在页面底部"
    default: "Powered by Go"
