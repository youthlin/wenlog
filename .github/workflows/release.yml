name: Build and Release

on:
  push:
    branches:
      - main
      - feat/plugin
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ''
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ''
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ''
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: '.exe'
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist/package
          version="${GITHUB_REF_NAME//\//-}"
          commit="${GITHUB_SHA}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X github.com/youthlin/blog/internal/version.Version=${version} -X github.com/youthlin/blog/internal/version.Commit=${commit} -X github.com/youthlin/blog/internal/version.Date=${date}"
          printf '%s\n' "${version}" > dist/package/VERSION
          go build -trimpath -ldflags="${ldflags}" -o "dist/package/blog${{ matrix.ext }}" ./cmd/server

      - name: Package binary
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME//\//-}"
          base="blog-${version}-${{ matrix.goos }}-${{ matrix.goarch }}"
          cd dist
          if [ '${{ matrix.archive }}' = 'zip' ]; then
            (cd package && zip "../${base}.zip" "blog${{ matrix.ext }}" VERSION)
          else
            tar -czf "${base}.tar.gz" -C package "blog${{ matrix.ext }}" VERSION
          fi
          sha256sum "${base}.${{ matrix.archive }}" > "${base}.${{ matrix.archive }}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blog-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build checksums file
        run: |
          set -euo pipefail
          cd dist
          cat *.sha256 | sort > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/checksums.txt
          generate_release_notes: true
