# # https://github.com/Yikun/hub-mirror-action
name: 同步到 Gitee
on: push

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source codes
        uses: actions/checkout@v4

      - name: sync to gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/youthLin
          dst: gitee/youthlin
          dst_key: ${{ secrets.dst_key }}
          dst_token: ${{ secrets.dst_token }}
          static_list: 'wenlog'
          debug: true

      - name: Download GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          for i in $(seq 1 40); do
            if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir dist \
                --pattern 'wenlog-*' \
                --pattern 'checksums.txt' || true
              if find dist -type f | grep -q .; then
                ls -lh dist
                exit 0
              fi
            fi
            echo "GitHub Release assets for ${GITHUB_REF_NAME} are not ready yet, retry ${i}/40..."
            sleep 15
          done
          echo "Timed out waiting for GitHub Release assets: ${GITHUB_REF_NAME}" >&2
          exit 1

      - name: Upload release assets to Gitee
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITEE_TOKEN: ${{ secrets.dst_token }}
          GITEE_OWNER: youthlin
          GITEE_REPO: wenlog
        run: |
          set -euo pipefail
          api="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          tag="${GITHUB_REF_NAME}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT

          release_json="${tmp}/release.json"
          http_code="$(curl -sS -o "${release_json}" -w '%{http_code}' "${api}/releases/tags/${tag}?access_token=${GITEE_TOKEN}")"
          if [ "${http_code}" = "404" ]; then
            curl -fsS -X POST "${api}/releases" \
              --data-urlencode "access_token=${GITEE_TOKEN}" \
              --data-urlencode "tag_name=${tag}" \
              --data-urlencode "name=${tag}" \
              --data-urlencode "body=同步自 GitHub Release ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}" \
              --data-urlencode "prerelease=false" > "${release_json}"
          elif [ "${http_code}" != "200" ]; then
            echo "Fetch Gitee release failed, status=${http_code}" >&2
            cat "${release_json}" >&2 || true
            exit 1
          fi

          release_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "${release_json}")"
          echo "Gitee release id: ${release_id}"

          for file in dist/*; do
            [ -f "${file}" ] || continue
            name="$(basename "${file}")"
            attach_id="$(python3 - "${release_json}" "${name}" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          name = sys.argv[2]
          for key in ("attach_files", "assets"):
              for item in data.get(key) or []:
                  if item.get("name") == name:
                      print(item.get("id", ""))
                      raise SystemExit
          PY
            )"
            if [ -n "${attach_id}" ]; then
              curl -fsS -X DELETE "${api}/releases/${release_id}/attach_files/${attach_id}" \
                --data-urlencode "access_token=${GITEE_TOKEN}" >/dev/null || true
            fi
            curl -fsS -X POST "${api}/releases/${release_id}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${file}"
            echo "Uploaded ${name} to Gitee release ${tag}"
          done
